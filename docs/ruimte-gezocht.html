<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171717" />
    <title>Ruimte Gezocht · Eindhoven</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./ruimte-gezocht.css?v=4" />
  </head>
  <body>
    <div class="rg-app">
      <header class="rg-bar">
        <div class="rg-bar-left">
          <p class="rg-kicker">Ruimte Gezocht</p>
          <p class="rg-tagline">Hoeveel Eindhoven blijft er voor jou over?</p>
        </div>
        <div class="rg-bar-actions">
          <button type="button" class="rg-saved-btn" id="saved-btn" hidden aria-label="Opgeslagen woningen">
            ♥ <span id="saved-count">0</span>
          </button>
          <button type="button" class="rg-filter-btn" id="filter-toggle" aria-expanded="false">Filters</button>
        </div>
      </header>

      <div class="rg-filters" id="filter-panel" hidden>
        <label class="rg-field">
          <span>Bruto per maand</span>
          <div class="rg-input-wrap"><span>€</span><input id="income" type="number" value="3500" step="100" /></div>
        </label>
        <label class="rg-field">
          <span>Personen</span>
          <input id="household" type="number" value="1" min="1" max="8" />
        </label>
        <div class="rg-filter-actions">
          <button type="button" class="rg-btn rg-btn-ghost" id="loc-btn">📍 Locatie</button>
          <button type="button" class="rg-btn rg-btn-primary" id="apply-filters">Toepassen</button>
        </div>
        <button type="button" class="rg-link-btn" id="landlord-open">Verhuur je? Draai de lens om →</button>
      </div>

      <div class="rg-landlord" id="landlord-panel" hidden>
        <button type="button" class="rg-back" id="landlord-close">← terug</button>
        <h2>Verhuur je een woning?</h2>
        <label class="rg-field">
          <span>Huurprijs</span>
          <div class="rg-input-wrap"><span>€</span><input id="landlord-rent" type="number" value="1450" step="50" /></div>
        </label>
        <label class="rg-field">
          <span>Inkomenseis</span>
          <select id="landlord-mult">
            <option value="3">3×</option>
            <option value="3.5">3,5×</option>
            <option value="4" selected>4×</option>
            <option value="4.5">4,5×</option>
          </select>
        </label>
        <button type="button" class="rg-btn rg-btn-primary" id="landlord-calc">Bereken →</button>
        <div id="landlord-result" class="rg-landlord-result"></div>
      </div>

      <main class="rg-feed" id="feed" tabindex="0">
        <p class="rg-feed-loading muted">Woningen laden…</p>
      </main>

      <nav class="rg-nav">
        <button type="button" class="rg-nav-btn active" data-view="feed">Woningen</button>
        <button type="button" class="rg-nav-btn" data-view="seekers">Je bent niet alleen</button>
        <button type="button" class="rg-nav-btn" data-view="map" id="nav-map">Kaart</button>
        <a class="rg-nav-btn" href="./index.html">Data</a>
      </nav>

      <div class="rg-map-overlay" id="map-overlay" hidden>
        <div class="rg-map-head">
          <button type="button" class="rg-back" id="map-close">← feed</button>
          <div class="rg-map-toggle">
            <button type="button" class="active" data-map-mode="all">Alles</button>
            <button type="button" data-map-mode="yours">Jouw Eindhoven</button>
          </div>
        </div>
        <div id="rg-map"></div>
        <p class="rg-map-stats" id="map-stats"></p>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./geo-utils.js?v=2"></script>
    <script src="./ruimte-gezocht.js?v=4"></script>
  </body>
</html>
