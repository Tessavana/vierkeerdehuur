<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#171717" />
    <title>Ruimte Gezocht · Eindhoven</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./ruimte-gezocht.css?v=8" />
  </head>
  <body>
    <div class="rg-app">
      <header class="rg-bar">
        <div class="rg-bar-left">
          <p class="rg-kicker">Ruimte Gezocht</p>
          <p class="rg-tagline" id="rg-tagline">Woningen waar je op mag reageren</p>
        </div>
        <div class="rg-bar-actions">
          <button type="button" class="rg-saved-btn" id="saved-btn" hidden aria-label="Opgeslagen">
            ♥ <span id="saved-count">0</span>
          </button>
          <button type="button" class="rg-filter-btn" id="filter-toggle" aria-expanded="false" hidden>Filters</button>
        </div>
      </header>

      <div class="rg-filters" id="filter-panel" hidden>
        <p class="rg-filters-intro">Stel je profiel in. Daarna zie je alleen woningen binnen bereik.</p>
        <label class="rg-field">
          <span>Bruto per maand</span>
          <div class="rg-input-wrap"><span>€</span><input id="income" type="number" value="3500" step="100" /></div>
        </label>
        <label class="rg-field">
          <span>Buitenruimte</span>
          <select id="outdoor-filter">
            <option value="any">Maakt niet uit</option>
            <option value="yes">Ja, verplicht</option>
            <option value="no">Nee / niet nodig</option>
          </select>
        </label>
        <div class="rg-field-row">
          <label class="rg-field">
            <span>Min. m²</span>
            <input id="min-m2" type="number" value="0" min="0" step="5" placeholder="0" />
          </label>
          <label class="rg-field">
            <span>Max. m²</span>
            <input id="max-m2" type="number" value="0" min="0" step="5" placeholder="0" />
          </label>
        </div>
        <div class="rg-field">
          <span>Stadsdeel</span>
          <p class="rg-field-hint muted">Niets aangevinkt = heel Eindhoven</p>
          <div id="wijk-filters" class="rg-wijk-filters"></div>
        </div>
        <div class="rg-filter-actions">
          <button type="button" class="rg-btn rg-btn-ghost" id="loc-btn">Locatie</button>
          <button type="button" class="rg-btn rg-btn-primary" id="apply-filters">Toon matches</button>
        </div>
        <button type="button" class="rg-link-btn" id="landlord-open">Verhuur je? Draai de lens om →</button>
      </div>

      <div class="rg-landlord" id="landlord-panel" hidden>
        <button type="button" class="rg-back" id="landlord-close">← terug</button>
        <h2>Verhuur je een woning?</h2>
        <label class="rg-field">
          <span>Huurprijs</span>
          <div class="rg-input-wrap"><span>€</span><input id="landlord-rent" type="number" value="1450" step="50" /></div>
        </label>
        <label class="rg-field">
          <span>Inkomenseis</span>
          <select id="landlord-mult">
            <option value="3">3×</option>
            <option value="3.5">3,5×</option>
            <option value="4" selected>4×</option>
            <option value="4.5">4,5×</option>
          </select>
        </label>
        <button type="button" class="rg-btn rg-btn-primary" id="landlord-calc">Bereken →</button>
        <div id="landlord-result" class="rg-landlord-result"></div>
      </div>

      <div class="rg-main" id="rg-main">
        <main class="rg-feed" id="feed-panel" tabindex="0">
          <p class="rg-feed-loading muted">Woningen laden…</p>
        </main>
        <div class="rg-map-panel" id="map-panel" hidden>
          <div id="rg-map"></div>
          <p class="rg-map-stats" id="map-stats"></p>
        </div>
        <section class="rg-seekers-panel" id="seekers-panel" hidden aria-label="Je bent niet alleen">
          <div class="rg-seekers-head">
            <h2>Je bent niet alleen</h2>
            <p class="muted" id="seekers-subline">Anderen zoeken ook in Eindhoven</p>
          </div>
          <div class="rg-seekers-list" id="seekers-list"></div>
          <footer class="rg-seekers-foot">
            <a class="rg-dashboard-link" href="./index.html">Volledig data-overzicht op dashboard →</a>
          </footer>
        </section>
      </div>

      <nav class="rg-tabbar" aria-label="Hoofdnavigatie">
        <button type="button" class="rg-tab-btn active" data-tab="feed" aria-current="page">
          <svg class="rg-tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 3l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></svg>
          <span class="rg-tab-label">Huizen</span>
        </button>
        <button type="button" class="rg-tab-btn" data-tab="map">
          <svg class="rg-tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-4.5 7-11a7 7 0 1 0-14 0c0 6.5 7 11 7 11z" fill="none" stroke="currentColor" stroke-width="1.75"/><circle cx="12" cy="10" r="2.25" fill="none" stroke="currentColor" stroke-width="1.75"/></svg>
          <span class="rg-tab-label">Kaart</span>
        </button>
        <button type="button" class="rg-tab-btn" data-tab="seekers">
          <svg class="rg-tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11a3 3 0 1 0-6 0 3 3 0 0 0 6 0z" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M4 19a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
          <span class="rg-tab-label">Samen</span>
          <span class="rg-tab-badge" id="seekers-badge" hidden></span>
        </button>
      </nav>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./geo-utils.js?v=5"></script>
    <script src="./ruimte-gezocht.js?v=8"></script>
  </body>
</html>
