# Light scan (~1–2 min): HTTP/API sources; Playwright providers rotate on cache.
name: Housing Scan (fast)

on:
  workflow_dispatch:
  schedule:
    # Every 10 min — data refresh. Docs deploy separately on push (pages-deploy.yml).
    - cron: "*/10 * * * *"

concurrency:
  group: housing-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/listings.db
            data/application_status.json
            data/telegram_offset.txt
            data/scan_bundle.json
            data/geocode_cache.json
            data/listing_registry.json
            data/market_registry.json
            data/detail_cache.json
            data/seekers_registry.json
            data/facebook_seekers_cache.json
            data/cache
            data/playwright_state.json
          key: housing-state-${{ github.run_id }}
          restore-keys: |
            housing-state-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - uses: actions/configure-pages@v5

      - name: Fast workrun
        env:
          SCAN_PROFILE: fast
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          OPENAI_API_KEY: ""
          SEEKERS_LLM_MODE: "off"
          LISTING_LLM_MODE: "off"
          SEARCH_URLS: ${{ vars.SEARCH_URLS || 'https://kamernet.nl/en/for-rent/apartment-eindhoven,https://www.pararius.com/apartments/eindhoven,https://www.funda.nl/zoeken/huur?selected_area=%5B%22eindhoven%22%5D,https://www.vesteda.com/nl/huurwoningen-eindhoven,https://www.vbtverhuurmakelaars.nl/huurwoningen-eindhoven,https://www.rotsvast.nl/woningaanbod/huur/eindhoven/,https://nmgwonen.nl/huurwoningen/eindhoven/,https://www.huurwoningen.nl/in/eindhoven/,https://www.huislijn.nl/huurwoningen/nederland/noord-brabant/eindhoven,https://rentfinder.nl,https://directwonen.nl/huurwoningen-huren/eindhoven' }}
          MAX_RENT: ${{ vars.MAX_RENT || '1150' }}
          MIN_SIZE: ${{ vars.MIN_SIZE || '20' }}
          SQLITE_PATH: data/listings.db
          VBT_WONINGEN_CACHE_TTL_SECONDS: "3600"
          GEOCODE_USE_PDOK: "true"
          FUNDA_USE_API: "true"
          FUNDA_API_MAX_PRICE: "2500"
          PARARIUS_MAX_DETAILS: "20"
          HUURWONINGEN_MAX_PAGES: "3"
          HUURWONINGEN_MAX_DETAILS: "40"
          DIRECTWONEN_MAX_PAGES: "2"
          REDDIT_SEEKER_RSS: "https://www.reddit.com/r/eindhoven/new.rss,https://www.reddit.com/r/NetherlandsHousing/new.rss"
        run: python -m src.workrun

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - uses: actions/cache/save@v4
        with:
          path: |
            data/listings.db
            data/application_status.json
            data/telegram_offset.txt
            data/scan_bundle.json
            data/geocode_cache.json
            data/listing_registry.json
            data/market_registry.json
            data/detail_cache.json
            data/seekers_registry.json
            data/facebook_seekers_cache.json
            data/cache
            data/playwright_state.json
          key: ${{ steps.restore-state.outputs.cache-primary-key }}

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
