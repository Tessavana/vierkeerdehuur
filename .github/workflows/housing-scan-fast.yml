# Light scan (~2 min): API/HTML sources only. Runs often to stay within free minutes.
name: Housing Scan (fast)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Free tier: ~every 10 min keeps the site fresh without burning minutes.
    - cron: "*/10 * * * *"

concurrency:
  group: housing-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/listings.db
            data/application_status.json
            data/telegram_offset.txt
            data/scan_bundle.json
            data/geocode_cache.json
            data/listing_registry.json
            data/market_registry.json
            data/detail_cache.json
            data/seekers_registry.json
            data/facebook_seekers_cache.json
            data/cache
          key: housing-state-${{ github.run_id }}
          restore-keys: |
            housing-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/configure-pages@v5

      - name: Fast workrun
        env:
          SCAN_PROFILE: fast
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEEKERS_LLM_MODE: borderline
          SEARCH_URLS: ${{ vars.SEARCH_URLS || 'https://kamernet.nl/en/for-rent/apartment-eindhoven,https://www.pararius.com/apartments/eindhoven,https://www.funda.nl/zoeken/huur?selected_area=%5B%22eindhoven%22%5D,https://www.vesteda.com/nl/huurwoningen-eindhoven,https://www.vbtverhuurmakelaars.nl/huurwoningen-eindhoven,https://www.rotsvast.nl/woningaanbod/huur/eindhoven/,https://nmgwonen.nl/huurwoningen/eindhoven/,https://www.huurwoningen.nl/in/eindhoven/,https://www.huislijn.nl/huurwoningen/nederland/noord-brabant/eindhoven,https://rentfinder.nl' }}
          MAX_RENT: ${{ vars.MAX_RENT || '1150' }}
          MIN_SIZE: ${{ vars.MIN_SIZE || '20' }}
          SQLITE_PATH: data/listings.db
          VBT_WONINGEN_CACHE_TTL_SECONDS: "3600"
          GEOCODE_USE_PDOK: "true"
          FUNDA_USE_API: "true"
          FUNDA_API_MAX_PRICE: "2500"
          FUNDA_MAX_DETAIL_PAGES: "40"
        run: python -m src.workrun

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - uses: actions/cache/save@v4
        with:
          path: |
            data/listings.db
            data/application_status.json
            data/telegram_offset.txt
            data/scan_bundle.json
            data/geocode_cache.json
            data/listing_registry.json
            data/market_registry.json
            data/detail_cache.json
            data/seekers_registry.json
            data/facebook_seekers_cache.json
            data/cache
          key: ${{ steps.restore-state.outputs.cache-primary-key }}

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
