name: Housing Scan

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore scan state cache
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/listings.db
            data/application_status.json
            data/telegram_offset.txt
          key: housing-state-${{ github.run_id }}
          restore-keys: |
            housing-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Run one scan
        env:
          SEARCH_URLS: ${{ vars.SEARCH_URLS || 'https://kamernet.nl/en/for-rent/apartment-eindhoven,https://www.pararius.com/apartments/eindhoven,https://www.funda.nl/zoeken/huur?selected_area=%5B%22eindhoven%22%5D,https://www.vesteda.com/nl/huurwoningen-eindhoven,https://www.vbtverhuurmakelaars.nl/huurwoningen-eindhoven,https://www.huurwoningen.nl/in/eindhoven/,https://www.huislijn.nl/huurwoningen/nederland/noord-brabant/eindhoven,https://rentfinder.nl' }}
          MAX_RENT: ${{ vars.MAX_RENT || '1150' }}
          MIN_SIZE: ${{ vars.MIN_SIZE || '20' }}
          POLL_INTERVAL_SECONDS: "300"
          SQLITE_PATH: data/listings.db
          ENABLE_PLAYWRIGHT_FALLBACK: "true"
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.telegram_feedback
          python main.py --once
          python -m src.workrun

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Save scan state cache
        uses: actions/cache/save@v4
        with:
          path: |
            data/listings.db
            data/application_status.json
            data/telegram_offset.txt
          key: ${{ steps.restore-state.outputs.cache-primary-key }}

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
